name: Device test (Android)

# Opt-in: this boots an emulator, so it is deliberately not on every push.
# Run it from the Actions tab ("Run workflow") or via:
#   gh workflow run device-test.yml
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Emulator API level
        required: false
        default: '34'
        type: choice
        options: ['34', '35']

jobs:
  integration:
    name: Integration test on API ${{ inputs.api_level || '34' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            flutter pub get
            flutter test integration_test/app_test.dart

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: build/reports
          if-no-files-found: ignore
