name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0). Defaults to creating no release.'
        required: false
        type: string

# The tag is the contract: it must match pubspec's version, the artifacts must
# come out of this workflow, and nothing publishes that is not this tree.

jobs:
  gate:
    name: Gate (format, analyze, test, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --exclude-tags network

      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB=$(sed -n 's/^version: //p' pubspec.yaml)
          PUB="${PUB%%+*}"
          if [ "$TAG" != "$PUB" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pubspec version '$PUB'."
            echo "Bump pubspec.yaml (and CHANGELOG) to the tagged version before tagging."
            exit 1
          fi

  build-apk:
    name: Android APKs (split per ABI, signed)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The keystore must be present for anything we would ship: a tag push
      # without the secret fails here, never as an unverifiable artifact.
      # The gradle file resolves storeFile relative to the repository root
      # (rootProject.file), so the decode target is android/keystore.jks,
      # not android/app/.
      - name: Check the keystore secret
        id: keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail fast without the keystore on tags
        if: startsWith(github.ref, 'refs/tags/') && steps.keystore.outputs.present == 'false'
        run: |
          echo "::error::Release tags require the ANDROID_KEYSTORE_B64 secret."
          echo "The debug-key fallback is for CI smoke builds only and is rejected below."
          exit 1

      - name: Decode the keystore
        if: steps.keystore.outputs.present == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build release APKs per ABI
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64,android-x64

      # Refuse to ship anything signed with the debug key, whatever the
      # secret dance above produced. The debug certificate always carries
      # the distinguished name "CN=Android Debug".
      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERTS" | head -2
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug key."
              exit 1
            fi
          done

      - name: Checksum the APKs
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-*-release.apk > SHA256SUMS-apk.txt
          cat SHA256SUMS-apk.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS-apk.txt
          if-no-files-found: error

  build-linux:
    name: Linux (release)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # Releases are GTK3 builds: the stable engine ships no GTK4 embedder. See
      # the "Configure Linux (GTK4)" job in dart.yml.
      - name: Build Linux
        run: flutter build linux --release

      - name: Archive the bundle
        run: tar -czf linux-release.tar.gz -C build/linux/x64/release/bundle .

      - name: Checksum the archive
        run: sha256sum linux-release.tar.gz | tee SHA256SUMS-linux.txt

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            linux-release.tar.gz
            SHA256SUMS-linux.txt
          if-no-files-found: error

  build-windows:
    name: Windows (release)
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive the bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip

      - name: Checksum the archive
        run: |
          $hash = Get-FileHash -Algorithm SHA256 windows-release.zip
          "$($hash.Hash.ToLower())  windows-release.zip" | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            windows-release.zip
            SHA256SUMS-windows.txt
          if-no-files-found: error

  build-macos:
    name: macOS (unsigned, release)
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Enable command line tools
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build macOS
        run: flutter build macos --release

      # Unsigned: Gatekeeper quarantines the app; the README documents the
      # right-click → Open workaround. Notarization is a post-release item.
      - name: Archive the app bundle
        run: tar -czf macos-release.tar.gz -C build/macos/Build/Products/Release .

      - name: Checksum the archive
        run: shasum -a 256 macos-release.tar.gz | tee SHA256SUMS-macos.txt

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            macos-release.tar.gz
            SHA256SUMS-macos.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-linux, build-windows, build-macos]
    # Only attach artifacts to a real tag push; a manual run is a dry build.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - name: Merge the checksums
        run: |
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS.txt

      # Semver tags with a pre-release identifier (v1.0.0-rc.1) publish as a
      # pre-release; everything else publishes as latest.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            **Upgrading from 0.1 requires a clean reinstall.** 0.1 was built with the Android debug key; this release is signed with the project's release key, so Android refuses the in-place update (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`). Back up settings first (Settings → Save a backup), uninstall 0.1, install this APK, restore the backup. The download history and queue are lost on uninstall and are not part of any backup; they do not transfer. See the CHANGELOG for what changed in this release.
          files: |
            *-release.apk
            *-release.tar.gz
            *-release.zip
            SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Auto-generate notes from the tag's commit, so the release page stays
          # truthful about what shipped even when CHANGELOG wasn't updated.
          generate_release_notes: true
